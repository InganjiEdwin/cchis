services:
  db:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    container_name: cchis_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cchis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: cchis_backend
    restart: unless-stopped
    command: sh -c "daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - source_uploads:/var/lib/cchis/source_uploads
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
    container_name: cchis_celery_worker
    restart: unless-stopped
    command: sh -c "celery -A core worker --loglevel=INFO"
    volumes:
      - ./backend:/app
      - source_uploads:/var/lib/cchis/source_uploads
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build:
      context: ./backend
    container_name: cchis_celery_beat
    restart: unless-stopped
    command: sh -c "celery -A core beat --loglevel=INFO"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  source_uploads:
