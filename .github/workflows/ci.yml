name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  NODE_VERSION: "22"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/ci-production.env config --quiet

      - name: Build frontend production image with resolved browser API origin
        run: docker compose --env-file deploy/ci-production.env build frontend

      - name: Smoke-test frontend production image and compiled origins
        run: |
          image="$(docker compose --env-file deploy/ci-production.env config --images | awk '$1 ~ /-frontend$/ {print $1; exit}')"
          test -n "$image"
          docker image inspect "$image" >/dev/null
          frontend/scripts/verify-production-image.sh "$image"

      - name: Build backend image
        run: docker compose build backend

      - name: Start database and Redis
        run: docker compose up -d db redis

      - name: Show dependency health
        run: docker compose ps

      - name: Run backend compile check
        run: docker compose run --rm backend python -m compileall core risk accounts

      - name: Run backend test suite
        run: docker compose run --rm backend python manage.py test --noinput
        env:
          CCHIS_DJANGO_DEBUG: "True"
          SECRET_KEY: ci-local-development-key
          ALLOWED_HOSTS: localhost,127.0.0.1,backend
          DB_NAME: cchis_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: db
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1

      - name: Run Python dependency audit
        run: docker compose run --rm backend sh -c "python -m pip install --no-cache-dir pip-audit && pip-audit -r requirements.txt"

      - name: Run production-like Django security check
        run: >-
          docker compose --env-file deploy/ci-production.env run --rm --no-deps
          backend python manage.py check --deploy --fail-level WARNING

      - name: Verify production Compose ignores ambient DEBUG
        run: >-
          DEBUG=release docker compose --env-file deploy/ci-production.env run --rm --no-deps
          backend python manage.py check --deploy --fail-level WARNING

      - name: Shut down services
        if: always()
        run: docker compose down -v
