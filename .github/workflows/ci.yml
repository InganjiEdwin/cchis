name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  NODE_VERSION: "22"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Start database and Redis
        run: docker compose up -d db redis

      - name: Show dependency health
        run: docker compose ps

      - name: Run backend compile check
        run: docker compose run --rm backend python -m compileall core risk accounts

      - name: Run backend test suite
        run: docker compose run --rm backend python manage.py test --noinput
        env:
          CCHIS_DEBUG: "True"
          SECRET_KEY: ci-local-development-key
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1,backend
          DB_NAME: cchis_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: db
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1

      - name: Run Python dependency audit
        run: docker compose run --rm backend sh -c "python -m pip install --no-cache-dir pip-audit && pip-audit -r requirements.txt"

      - name: Run production-like Django security check
        run: >-
          docker compose run --rm
          -e CCHIS_ENVIRONMENT=production
          -e DEBUG=False
          -e SECRET_KEY=ci-production-secret-key-0123456789012345678901234567890123456789
          -e ALLOWED_HOSTS=localhost,backend
          -e CSRF_TRUSTED_ORIGINS=https://app.example.test
          -e CORS_ALLOW_ALL_ORIGINS=False
          -e CORS_ALLOWED_ORIGINS=https://app.example.test
          -e SECURE_SSL_REDIRECT=True
          -e SECURE_SSL_REDIRECT_REVERSE_PROXY_EXEMPTION=False
          -e SESSION_COOKIE_SECURE=True
          -e CSRF_COOKIE_SECURE=True
          -e AUTH_ACCESS_COOKIE_SECURE=True
          -e AUTH_REFRESH_COOKIE_SECURE=True
          -e AUTH_ACCESS_COOKIE_NAME=__Host-cchis_access
          -e AUTH_REFRESH_COOKIE_NAME=__Host-cchis_refresh
          -e AUTH_ACCESS_COOKIE_PATH=/
          -e AUTH_REFRESH_COOKIE_PATH=/
          -e AUTH_TOKEN_RESPONSE_MODE=cookie_only
          -e SECURE_HSTS_SECONDS=31536000
          -e SECURE_HSTS_INCLUDE_SUBDOMAINS=True
          -e SECURE_HSTS_PRELOAD=True
          -e TRUST_X_FORWARDED_PROTO=False
          -e TRUST_X_FORWARDED_FOR=False
          -e USE_X_FORWARDED_HOST=False
          -e TRUSTED_PROXY_CONFIGURED=False
          -e EMAIL_PROVIDER=stub
          -e SMS_PROVIDER=stub
          backend python manage.py check --deploy --fail-level WARNING

      - name: Shut down services
        if: always()
        run: docker compose down -v
